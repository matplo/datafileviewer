name: Publish to PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

jobs:
  release:
    name: Create GitHub Release
    # Only for a pushed tag -- an actual `release` event (or manual
    # dispatch) already has its release, so skip re-creating one.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create release for this tag (if it doesn't exist yet)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "release ${{ github.ref_name }} already exists, skipping"
          else
            gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
          fi

  build:
    name: Build distribution
    needs: [release]
    # Run for the release/workflow_dispatch triggers (where `release` is
    # skipped) as well as after a successful tag-push release creation.
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Install package (for tests)
        run: python -m pip install '.[all]'

      - name: Run tests
        run: python -m pip install pytest && python -m pytest

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/datafileviewer/
    permissions:
      id-token: write  # required for PyPI trusted publishing (OIDC)
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
