[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datafileviewer"
version = "1.0.2"
description = "Terminal viewer for ROOT, Parquet, HDF5, numpy, and pandas-readable files — ASCII tree, branch/column tables, and an interactive TUI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "matplo" },
]
keywords = ["datafileviewer", "rootfileviewer", "root", "uproot", "parquet", "pyarrow", "hdf5", "h5py", "numpy", "npy", "npz", "pandas", "csv", "feather", "matplotlib", "png", "cern", "physics", "terminal", "tui", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "uproot>=5.0",
    "rich>=13.0",
    "textual>=0.50",
    "plotext>=5.0",
    "textual-plotext>=1.0",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14.0"]
hdf5 = ["h5py>=3.0"]
pandas = ["pandas>=2.0", "pyarrow>=14.0"]
matplotlib = ["matplotlib>=3.0"]
all = ["datafileviewer[parquet,hdf5,pandas,matplotlib]"]

[project.urls]
Homepage = "https://github.com/matplo/datafileviewer"
Issues = "https://github.com/matplo/datafileviewer/issues"

[project.scripts]
datafileviewer = "datafileviewer.cli:main"
dfv = "datafileviewer.cli:main"
dfvt = "datafileviewer.cli:main_tui"

[tool.hatch.build.targets.wheel]
packages = ["src/datafileviewer"]
